<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titre}">Notification CSE</title>
</head>
<body style="margin:0;padding:0;background:#f3f4f6;font-family:Arial,Helvetica,sans-serif;color:#111827;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f3f4f6;padding:24px 0;">
  <tr>
    <td align="center">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0"
             style="max-width:600px;width:100%;background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr>
          <td style="background:#0f2a4a;padding:20px 24px;color:#ffffff;">
            <div style="font-size:20px;font-weight:bold;">CSE</div>
            <div style="font-size:13px;opacity:.85;">Compagnie Sahélienne d'Entreprises — Gestion des matériels</div>
          </td>
        </tr>
        <tr>
          <td th:style="'height:4px;background:' + ${couleur} + ';'" style="height:4px;background:#2563eb;"></td>
        </tr>
        <tr>
          <td style="padding:24px;">
            <p style="margin:0 0 12px;" th:text="'Bonjour ' + ${nom} + ','">Bonjour,</p>
            <h1 style="font-size:18px;margin:0 0 12px;" th:text="${titre}">Titre</h1>
            <p style="margin:0 0 20px;line-height:1.5;" th:text="${message}">Message</p>
            <p th:if="${lien != null}" style="margin:0 0 20px;">
              <a th:href="${lien}" href="#"
                 th:style="'display:inline-block;padding:10px 18px;border-radius:6px;color:#ffffff;text-decoration:none;background:' + ${couleur} + ';'"
                 style="display:inline-block;padding:10px 18px;border-radius:6px;color:#ffffff;text-decoration:none;background:#2563eb;">
                Ouvrir dans la plateforme CSE
              </a>
            </p>
            <p style="margin:0;font-size:12px;color:#6b7280;">
              Message automatique de la plateforme CSE — merci de ne pas y répondre.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
