server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
spring:
  application:
    name: ms-gateway
  main:
    web-application-type: reactive
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:PT1S}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8180/realms/cse/protocol/openid-connect/certs}
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8180/realms/cse}
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:PT30S}
cse:
  openapi:
    title: ms-gateway — Passerelle d'API
    description: >-
      Point d'entrée unique de la plateforme CSE : routage vers les microservices, authentification
      JWT, limitation de débit, coupe-circuits et supervision.
  gateway:
    # URL de chaque service : variable MS_<NOM>_URL (ex. MS_AUTH_URL=http://ms-auth:8081 en Docker).
    services:
      ms-auth:
        url: ${MS_AUTH_URL:http://localhost:8081}
        chemins: [/api/me, /api/me/**, /api/admin/**]
      ms-besoins:
        url: ${MS_BESOINS_URL:http://localhost:8082}
        chemins: [/api/besoins, /api/besoins/**]
      ms-achats:
        url: ${MS_ACHATS_URL:http://localhost:8083}
        chemins:
          - /api/appels-offres
          - /api/appels-offres/**
          - /api/contrats
          - /api/contrats/**
          - /api/engagements
          - /api/engagements/**
          - /api/factures
          - /api/factures/**
          - /api/finance/**
          - /api/besoins-a-acheter
          - /api/besoins-a-acheter/**
          - /api/portail/appels-offres
          - /api/portail/appels-offres/**
          - /api/portail/offres
          - /api/portail/offres/**
          - /api/portail/attributions
          - /api/portail/attributions/**
          - /api/portail/factures
          - /api/portail/factures/**
      ms-fournisseurs:
        url: ${MS_FOURNISSEURS_URL:http://localhost:8084}
        chemins:
          - /api/fournisseurs
          - /api/fournisseurs/**
          - /api/litiges
          - /api/litiges/**
          - /api/portail/profil
          - /api/portail/profil/**
          - /api/portail/catalogue
          - /api/portail/catalogue/**
          - /api/portail/documents
          - /api/portail/documents/**
          - /api/portail/inscription
          - /api/portail/inscription/**
          - /api/portail/litiges
          - /api/portail/litiges/**
      ms-suivi:
        url: ${MS_SUIVI_URL:http://localhost:8085}
        chemins:
          - /api/materiels
          - /api/materiels/**
          - /api/maintenances
          - /api/maintenances/**
          - /api/chantiers
          - /api/chantiers/**
          - /api/affectations
          - /api/affectations/**
          - /api/pannes
          - /api/pannes/**
          - /api/referentiels/**
      ms-reporting:
        url: ${MS_REPORTING_URL:http://localhost:8086}
        chemins: [/api/reporting/**]
      ms-chatbot:
        url: ${MS_CHATBOT_URL:http://localhost:8087}
        chemins: [/api/chatbot/**]
      ms-notification:
        url: ${MS_NOTIFICATION_URL:http://localhost:8088}
        chemins: [/api/notifications, /api/notifications/**]
      ms-audit:
        url: ${MS_AUDIT_URL:http://localhost:8089}
        chemins: [/api/audit, /api/audit/**]
    sse:
      service: ms-notification
      chemins: [/api/notifications/stream]
      # Le serveur envoie un « ping » toutes les 25 s : coupure seulement après un long silence.
      delai: ${GATEWAY_SSE_TIMEOUT:PT1H}
    limite-debit:
      actif: ${GATEWAY_RATE_LIMIT_ENABLED:true}
      debit: ${GATEWAY_RATE_LIMIT_REPLENISH:20}
      rafale: ${GATEWAY_RATE_LIMIT_BURST:40}
      jetons-par-requete: 1
    coupe-circuit:
      actif: ${GATEWAY_CIRCUIT_BREAKER_ENABLED:true}
      delai: ${GATEWAY_CIRCUIT_BREAKER_TIMEOUT:PT20S}
      fenetre: 20
      seuil-echec: 50
      attente-ouvert: PT10S
    cors:
      origines-autorisees: ${GATEWAY_CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
      max-age: PT1H
    sonde:
      chemin: /actuator/health
      delai: ${GATEWAY_HEALTH_PROBE_TIMEOUT:PT2S}
    securite:
      portail-sans-role-fournisseur: []
management:
  endpoints.web.exposure.include: health,info,metrics,prometheus
  endpoint.health.probes.enabled: true
springdoc:
  api-docs:
    # Sous /v3/api-docs/ pour ne pas masquer les routes agrégées /v3/api-docs/<service>.
    path: /v3/api-docs/ms-gateway
  swagger-ui:
    path: /swagger-ui.html
    oauth:
      client-id: cse-swagger
      use-pkce-with-authorization-code-grant: true
logging:
  pattern:
    level: "%5p [${spring.application.name}]"
