# Frontal HTTPS de l'application web interne CSE (nginx-unprivileged, utilisateur non-root UID 101).
# Modèle traité au démarrage par envsubst (image officielle Nginx : /etc/nginx/templates/*.template).
# Variables (valeurs par défaut dans le Dockerfile) :
#   NGINX_HTTP_PORT / NGINX_HTTPS_PORT  ports d'écoute DANS le conteneur (> 1024 : aucun privilège requis)
#   PUBLIC_HTTPS_PORT                   port HTTPS vu par le navigateur (cible de la redirection 301)
#   GATEWAY_UPSTREAM                    passerelle d'API (hôte:port), ms-gateway:8080 en Compose
#   KEYCLOAK_PUBLIC_URL                 origine Keycloak autorisée par la CSP (connect-src / frame-src)
#   NGINX_SSE_TIMEOUT                   délai de lecture du flux SSE des notifications
# __CSP_SCRIPT_HASHES__ est remplacé à la construction de l'image par les empreintes SHA-256 des
# scripts en ligne de index.html et silent-check-sso.html (voir infra/nginx/csp-hashes.mjs).

upstream cse_gateway {
    server ${GATEWAY_UPSTREAM};
    keepalive 32;
}

# En-tête « Connection » : vide (keep-alive amont) sauf demande explicite d'upgrade.
map $http_upgrade $connexion_amont {
    default upgrade;
    ''      '';
}

# Politique de cache : index.html jamais en cache, ressources fingerprintées (hash Vite) un an.
map $uri $cse_cache_control {
    ~^/assets/          "public, max-age=31536000, immutable";
    default             "no-cache";
}

# HTTP : redirection permanente vers HTTPS (aucun contenu servi en clair).
server {
    listen ${NGINX_HTTP_PORT};
    listen [::]:${NGINX_HTTP_PORT};
    server_name _;
    server_tokens off;

    # Sonde de vivacité locale du conteneur (pas de redirection).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host:${PUBLIC_HTTPS_PORT}$request_uri;
    }
}

server {
    listen ${NGINX_HTTPS_PORT} ssl;
    listen [::]:${NGINX_HTTPS_PORT} ssl;
    http2 on;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # ---- TLS (certificats montés depuis infra/certs, générés par scripts/gen-certs.sh) ----
    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:CSE_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- Compression (gzip dynamique + fichiers .gz précompressés à la construction) ----
    # Brotli : non disponible dans l'image officielle (module ngx_brotli tiers non packagé), voir OPERATIONS.md.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml application/problem+json;

    # ---- En-têtes de sécurité (add_header n'est hérité que si le bloc n'en définit pas : tout ici) ----
    # style-src 'unsafe-inline' : Radix UI (react-remove-scroll) et Sonner injectent des balises <style>
    # à l'exécution ; les scripts, eux, restent strictement limités à 'self' + empreintes.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.tile.openstreetmap.org; font-src 'self' data:; connect-src 'self' ${KEYCLOAK_PUBLIC_URL}; frame-src 'self' ${KEYCLOAK_PUBLIC_URL}; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' ${KEYCLOAK_PUBLIC_URL}; worker-src 'self' blob:; manifest-src 'self'" always;
    # SAMEORIGIN et non DENY : keycloak-js charge /silent-check-sso.html dans une iframe de même origine.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cache-Control $cse_cache_control always;

    # ---- Flux SSE des notifications : sans tampon, lecture longue (ping serveur toutes les 25 s) ----
    location = /api/notifications/stream {
        proxy_pass http://cse_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout ${NGINX_SSE_TIMEOUT};
        proxy_send_timeout ${NGINX_SSE_TIMEOUT};
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ---- API : relais vers la passerelle (qui porte JWT, RBAC, limitation de débit, coupe-circuits) ----
    location /api/ {
        proxy_pass http://cse_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection $connexion_amont;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Cache-Control : laissé à la passerelle (Spring Security envoie déjà « no-cache, no-store »).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ---- Application monopage : toute route inconnue renvoie index.html (React Router) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Une ressource fingerprintée absente est une vraie 404 (pas de repli sur index.html).
    location /assets/ {
        try_files $uri =404;
    }
}
