# Intégration continue CSE : mêmes portes de qualité que `make verify` (backend puis frontend),
# puis construction des images Docker sur la branche principale.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      # Spotless, Checkstyle, enforcer, tests unitaires + intégration (Testcontainers : Docker est
      # disponible sur les runners ubuntu-latest), ArchUnit, snapshots OpenAPI, seuils JaCoCo.
      - name: mvn verify
        run: mvn -B -ntp -f backend/pom.xml verify
      - name: Rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-backend
          path: |
            backend/**/target/surefire-reports/
            backend/**/target/failsafe-reports/
            backend/**/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

  frontend:
    name: Frontend (web-interne)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Installation (lockfile figé)
        run: pnpm install --frozen-lockfile --filter @cse/web-interne...
      - name: Typecheck
        run: pnpm --filter @cse/web-interne typecheck
      - name: Lint
        run: pnpm --filter @cse/web-interne lint
      - name: Tests
        run: pnpm --filter @cse/web-interne test
      - name: Build
        run: pnpm --filter @cse/web-interne build

  images:
    name: Images Docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Image représentative des microservices (même Dockerfile générique pour les dix).
          - nom: ms-gateway
            context: backend
            file: backend/Dockerfile
            build-args: SERVICE=ms-gateway
            build-contexts: ''
          - nom: web-interne
            context: frontend
            file: frontend/apps/web-interne/Dockerfile
            build-args: ''
            build-contexts: nginx=infra/nginx
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cse-${{ matrix.nom }}
          tags: |
            type=sha
            type=raw,value=main
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          build-contexts: ${{ matrix.build-contexts }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nom }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nom }}
