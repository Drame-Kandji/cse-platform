# Analyse des vulnérabilités des dépendances (OWASP dependency-check) : séparée de la CI car lente
# (téléchargement de la base NVD). Hebdomadaire et à la demande.
# Secret recommandé : NVD_API_KEY (https://nvd.nist.gov/developers/request-an-api-key), sans clé,
# la mise à jour de la base NVD est fortement limitée en débit.
name: Vulnérabilités des dépendances

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: OWASP dependency-check (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/**/pom.xml
      - name: Cache de la base NVD
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      # Échec si une vulnérabilité de score CVSS >= 7 (élevée/critique) est détectée.
      - name: dependency-check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B -ntp -f backend/pom.xml org.owasp:dependency-check-maven:12.1.0:aggregate
          -DfailBuildOnCVSS=7 -Dformats=HTML,JSON -DnvdApiKeyEnvironmentVariable=NVD_API_KEY
          -DossindexAnalyzerEnabled=false
      - name: Rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check
          path: backend/target/dependency-check-report.*
          if-no-files-found: ignore

  frontend:
    name: pnpm audit (web-interne)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Audit des dépendances de production
        run: pnpm audit --prod --audit-level high
